<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntária</title>
    <style>
        /* ESTILOS (Mantidos iguais) */
        :root {
            --cor-principal: #ff69b4; /* Rosa */
            --cor-fundo: #fcfcfc;
            --cor-texto: #333;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--cor-fundo); 
            color: var(--cor-texto);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
        }

        h2 {
            color: var(--cor-principal);
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 15px;
        }

        input[type="text"], 
        input[type="email"], 
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            font-size: 16px;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus {
            border-color: var(--cor-principal);
            outline: none;
            box-shadow: 0 0 5px rgba(255, 105, 180, 0.3);
        }
        
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--cor-principal); 
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 30px;
        }

        button:hover {
            background-color: #e05c9e;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <form action="processa_cadastro.php" method="POST">
        <h2>Formulário de Cadastro - Voluntária</h2>
        <input type="hidden" name="tabela" value="voluntarias">

        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
        </div>
        
        <!-- E-MAIL MELHORADO: AGORA ACEITA APENAS DOMÍNIO @GMAIL.COM -->
        <div class="form-group">
            <label for="email">E-mail (apenas @gmail.com):</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="nome@gmail.com"
                required
            >
        </div>
        
        <!-- TELEFONE (11 DÍGITOS COM MÁSCARA) -->
        <div class="form-group">
            <label for="telefone">Celular/Telefone (com DDD - 11 dígitos totais):</label>
            <input 
                type="text" 
                id="telefone" 
                name="telefone" 
                inputmode="numeric" 
                maxlength="15" 
                placeholder="(99) 91234-5678" 
                required
            > 
        </div>

        <!-- CPF (11 DÍGITOS COM MÁSCARA) -->
        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input 
                type="text" 
                id="cpf" 
                name="cpf" 
                inputmode="numeric" 
                maxlength="14" 
                placeholder="123.456.789-00" 
                required
            > 
        </div>
        
        <div class="form-group">
            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg" placeholder="Ex: 12.345.678-9"> 
        </div>

        <div class="form-group">
            <label for="endereco">Endereço Completo:</label>
            <textarea id="endereco" name="endereco" placeholder="Rua, Número, Bairro, Cidade - Estado"></textarea> 
        </div>
        <div class="form-group">
            <label for="area_atuacao">Área de Atuação (Ex: Psicologia, Transporte, Jurídico):</label>
            <input type="text" id="area_atuacao" name="area_atuacao" required>
        </div>

        <div class="form-group">
            <label for="disponibilidade">Disponibilidade (Ex: Manhã, Terças e Quintas, etc.):</label>
            <textarea id="disponibilidade" name="disponibilidade" required></textarea>
        </div>

        <button type="submit">Finalizar Cadastro</button>
    </form>

    <script>
        // Função utilitária para remover tudo, exceto dígitos
        const cleanDigits = (value) => value.replace(/\D/g, '');

        // Implementação da Máscara de CPF (11 dígitos: XXX.XXX.XXX-XX)
        function maskCPF(e) {
            let value = cleanDigits(e.target.value);
            
            // Limita a 11 dígitos
            if (value.length > 11) {
                value = value.substring(0, 11);
            }

            // Aplica a máscara: 123.456.789-00
            let maskedValue = '';
            if (value.length > 9) {
                maskedValue = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                maskedValue = value.replace(/^(\d{3})(\d{3})(\d{1,3})$/, '$1.$2.$3');
            } else if (value.length > 3) {
                maskedValue = value.replace(/^(\d{3})(\d{1,3})$/, '$1.$2');
            } else {
                maskedValue = value;
            }

            e.target.value = maskedValue;
        }

        // Implementação da Máscara de Telefone (11 dígitos: (XX) 9XXXX-XXXX)
        function maskTelefone(e) {
            let value = cleanDigits(e.target.value);

            // Limita a 11 dígitos (2 DDD + 9 Telefone)
            if (value.length > 11) {
                value = value.substring(0, 11);
            }
            
            let maskedValue = '';

            // Aplica a máscara: (XX) 9XXXX-XXXX
            if (value.length > 2) {
                maskedValue += `(${value.substring(0, 2)}) `;
            } else {
                maskedValue = value;
            }
            
            if (value.length > 7) { // 2 DDD + 5 (primeira parte do número)
                // Completa o número com o hífen
                maskedValue += `${value.substring(2, 7)}-${value.substring(7, 11)}`;
            } else if (value.length > 2) {
                // Completa apenas a primeira parte do número, sem hífen
                maskedValue += value.substring(2, 7);
            }

            e.target.value = maskedValue;
        }
        
        // Atacha os event listeners aos campos
        document.addEventListener('DOMContentLoaded', () => {
            const cpfInput = document.getElementById('cpf');
            const telefoneInput = document.getElementById('telefone');

            if (cpfInput) {
                cpfInput.addEventListener('input', maskCPF);
            }
            
            if (telefoneInput) {
                telefoneInput.addEventListener('input', maskTelefone);
            }
        });

        // Função de alerta customizada (Substituindo alert() por um modal simples)
        function alert(message) {
            const modalId = 'custom-alert-modal';
            let modal = document.getElementById(modalId);
            
            if (!modal) {
                modal = document.createElement('div');
                modal.id = modalId;
                modal.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                    background-color: rgba(0,0,0,0.5); display: flex; 
                    justify-content: center; align-items: center; z-index: 1000;
                    opacity: 0; visibility: hidden; transition: opacity 0.3s;
                `;
                modal.innerHTML = `
                    <div style="background: white; padding: 25px; border-radius: 10px; 
                                max-width: 400px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
                        <p style="margin-bottom: 20px; font-size: 16px;">${message}</p>
                        <button onclick="document.getElementById('${modalId}').style.opacity=0; 
                                         document.getElementById('${modalId}').style.visibility='hidden';" 
                                style="background-color: var(--cor-principal); color: white; border: none; 
                                       padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                            Entendido
                        </button>
                    </div>
                `;
                document.body.appendChild(modal);
            } else {
                 modal.querySelector('p').textContent = message;
            }
            
            modal.style.opacity = 1;
            modal.style.visibility = 'visible';
        }

        // Validação final antes de enviar o formulário
        document.querySelector('form').addEventListener('submit', function(e) {
            const cpf = cleanDigits(document.getElementById('cpf').value);
            const telefone = cleanDigits(document.getElementById('telefone').value);
            const emailInput = document.getElementById('email');
            
            let isValid = true;

            // 1. Validação de E-mail (@gmail.com)
            if (emailInput && emailInput.value) {
                // Regex para garantir que o e-mail termina com @gmail.com (case insensitive)
                const emailPattern = /^[^\s@]+@gmail\.com$/i; 
                if (!emailPattern.test(emailInput.value)) {
                    alert('O E-mail deve ser um endereço válido do Gmail (ex: nome@gmail.com).');
                    emailInput.focus();
                    isValid = false;
                }
            }
            
            // 2. Validação de CPF (11 dígitos)
            if (isValid && cpf.length !== 11) {
                alert('O CPF deve conter exatamente 11 dígitos numéricos.');
                document.getElementById('cpf').focus();
                isValid = false;
            }
            
            // 3. Validação de Telefone (11 dígitos - DDD + Número)
            if (isValid && telefone.length !== 11) { 
                alert('O Telefone deve conter exatamente 11 dígitos numéricos (incluindo o DDD).');
                document.getElementById('telefone').focus();
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault(); // Impede o envio se houver erro
            }
        });
        
    </script>

</body>
</html>
