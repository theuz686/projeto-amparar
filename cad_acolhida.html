<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Acolhida</title>
    <style>
        /* ESTILOS (Mantidos iguais ao de Amparadas) */
        :root {
            --cor-principal: #ff69b4; /* Rosa */
            --cor-fundo: #fcfcfc;
            --cor-texto: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--cor-fundo); 
            color: var(--cor-texto);
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
        }

        h2 {
            color: var(--cor-principal);
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 15px;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            font-size: 16px;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus {
            border-color: var(--cor-principal);
            outline: none;
            box-shadow: 0 0 5px rgba(255, 105, 180, 0.3);
        }
        
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--cor-principal); 
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 30px;
        }

        button:hover {
            background-color: #e05c9e;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <form action="processa_cadastro.php" method="POST">
        <h2>Formulário de Cadastro - Pessoa Acolhida</h2>
        <input type="hidden" name="tabela" value="acolhidas">

        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        
        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" placeholder="dd/mm/aaaa">
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
        </div>
        
        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone"> 
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf"> 
        </div>
        
        <div class="form-group">
            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg"> 
        </div>

        <div class="form-group">
            <label for="endereco">Endereço Completo:</label>
            <textarea id="endereco" name="endereco"></textarea> 
        </div>
        <div class="form-group">
            <label for="numero_sid">Número SID (Obrigatório):</label>
            <input type="text" id="numero_sid" name="numero_sid" required>
        </div>

        <div class="form-group">
            <label for="descricao_necessidades">Descrição das Necessidades:</label>
            <textarea id="descricao_necessidades" name="descricao_necessidades" required></textarea>
        </div>

        <button type="submit">Finalizar Cadastro</button>
    </form>

</body>
</html>
